name: modeling-copilot

services:
  mongo:
    image: mongo:8.0
    ports:
      # Host access: mongodb://admin:admin@localhost:27017/?authSource=admin
      - "127.0.0.1:27222:27017"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo-data:/data/db
    networks: [default, database]

  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MONGODB_URI: mongodb://admin:admin@mongo:27017/?authSource=admin
      # Tokens of the local Feedbacksystem 2.0: RS256 against the key set its
      # identity service publishes on host port 8080. The issuer is the web
      # shell on port 8083, through which the tokens are requested.
      JWT_ALGORITHM: RS256
      JWT_JWKS_URI: http://host.docker.internal:8080/oauth2/jwks
      JWT_ISSUER: http://localhost:8083
      # Sign-in without the Feedbacksystem: the API exchanges and renews the
      # tokens through the same shell as the browser's authorization request.
      # Going directly to port 8080 can select a different issuer. For a PUBLIC
      # client leave OIDC_CLIENT_SECRET empty, as it is locally.
      OIDC_TOKEN_URI: http://host.docker.internal:8083/oauth2/token
      # Preserve the public origin when connecting through Docker's host alias.
      OIDC_TOKEN_HOST: localhost:8083
      OIDC_CLIENT_SECRET: ""
      DOCS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173
      DAGU_BASE_URL: http://dagu:8080
      # Own tokens for collab-kit, signed with this private key; the issuer and actor
      # must match the collab-kit service below. A test key for local development only:
      # Portainer takes its own from collab-kit-config and modeling-copilot-api-secrets,
      # never use this one there.
      CK_BASE_URL: http://collab-kit:24202
      SERVICE_ISSUER: modeling-copilot-api
      SERVICE_ALGORITHM: ES256
      SERVICE_ACTOR: service-modeling-copilot
      SERVICE_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQguCmP1wcjuJcbgrTZ
        tCntiTimSIs5d544GW/MNkdMMZWhRANCAATMrzduP6F3BOBlif0lWHw/jvNsfF+k
        hbQJBfWCi0sc7VLjIobP2Cyk9YB7Efjs++iLOeWykAfe6YIXQLY7mbId
        -----END PRIVATE KEY-----
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
    networks: [default, database]

  dagu:
    image: ghcr.io/dagucloud/dagu:2.16.6
    entrypoint:
      - /bin/sh
      - -ec
      - |
        tr -d '\r' < /etc/kube/init.sh | /bin/sh
        exec /usr/local/bin/tini -g -- /entrypoint.sh dagu start-all
    ports:
      - "127.0.0.1:8525:8080"
    environment:
      DAGU_HOST: 0.0.0.0
      DAGU_PORT: 8080
      DAGU_DAGS_DIR: /var/lib/dagu/dags
      DAGU_WIKI_DIR: /var/lib/dagu/wiki
      DAGU_DATA_DIR: /var/lib/dagu/data
      DAGU_LOG_DIR: /var/lib/dagu/logs
      DAGU_BASE_CONFIG: /var/lib/dagu/base.yaml
      DAGU_AUTH_MODE: none
      KUBECONFIG: /etc/kube/config
    volumes:
      - dagu-data:/var/lib/dagu
      - ./dagu/workflows:/var/lib/dagu/dags
      - ./dagu/infra/base.yaml:/var/lib/dagu/base.yaml
      - ~/.kube/config:/etc/kube/source-config:ro
      - ./dagu/infra/dev/10-use-host-kube-api.sh:/etc/kube/init.sh:ro
    restart: unless-stopped

  ck-mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initiates the replica set on first start and reports healthy once it is primary.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - ck-mongo-data:/data/db
    restart: unless-stopped

  collab-kit:
    image: ghcr.io/thm-mni-ii/collab-kit:v0.6.3
    ports:
      - "127.0.0.1:24202:24202"
    environment:
      MONGODB_URI: mongodb://ck-mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: collab_kit
      # Same Feedbacksystem 2.0 tokens as the api.
      JWT_ALGORITHM: RS256
      JWT_JWKS_URI: http://host.docker.internal:8080/oauth2/jwks
      JWT_ISSUER: http://localhost:8083
      ACTOR_CLAIM: id
      TOP_CLAIM: globalRole
      TOP_VALUES: ADMIN,MODERATOR
      ALLOWED_ORIGINS: http://localhost:8085
      # The api signs its own tokens; only the public key of its local test key lies here,
      # Portainer takes its own. With all four collab-kit creates the group "services"
      # with every right for SERVICE_ACTOR on each start.
      SERVICE_ISSUER: modeling-copilot-api
      SERVICE_ALGORITHM: ES256
      SERVICE_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEzK83bj+hdwTgZYn9JVh8P47zbHxf
        pIW0CQX1gotLHO1S4yKGz9gspPWAexH47PvoiznlspAH3umCF0C2O5myHQ==
        -----END PUBLIC KEY-----
      SERVICE_ACTOR: service-modeling-copilot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ck-mongo:
        condition: service_healthy
    restart: unless-stopped

  workflow-synonym-matching:
    image: modeling-copilot/synonym-matching:0.2.0
    build:
      context: ./dagu/workflow-services
      dockerfile: synonym-matching/Dockerfile
    profiles: [workflow-services]

  workflow-synonym-matching-louis:
    image: modeling-copilot/synonym-matching-louis:0.1.1
    build:
      context: ./dagu/workflow-services/synonym-matching-louis
    profiles: [workflow-services]

  workflow-graph-parser:
    image: modeling-copilot/graph-parser:0.4.2
    build:
      context: ./dagu/workflow-services
      dockerfile: graph-parser/Dockerfile
    profiles: [workflow-services]

  workflow-model-label-extraction:
    image: modeling-copilot/model-label-extraction:0.2.0
    build:
      context: ./dagu/workflow-services
      dockerfile: model-label-extraction/Dockerfile
    profiles: [workflow-services]

  workflow-one-to-one-matching:
    image: modeling-copilot/one-to-one-graph-matching:0.3.0
    build:
      context: ./dagu/workflow-services
      dockerfile: one-to-one-graph-matching/Dockerfile
    profiles: [workflow-services]

  workflow-minimal-matching-unit:
    image: modeling-copilot/minimal-matching-unit:0.3.0
    build:
      context: ./dagu/workflow-services
      dockerfile: minimal-matching-unit/Dockerfile
    profiles: [workflow-services]

  workflow-feedback-generation:
    image: modeling-copilot/feedback-generation:0.3.0
    build:
      context: ./dagu/workflow-services
      dockerfile: feedback-generation/Dockerfile
    profiles: [workflow-services]

  workflow-data:
    image: modeling-copilot/workflow-data:0.2.1
    build:
      context: ./dagu/workflow-services
      dockerfile: workflow-data/Dockerfile
    profiles: [workflow-services]

volumes:
  mongo-data:
  dagu-data:
  ck-mongo-data:

networks:
  database:
    internal: true
