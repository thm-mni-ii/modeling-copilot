apiVersion: v1
kind: Namespace
metadata:
  name: modeling-copilot

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modeling-copilot-config
  namespace: modeling-copilot
data:
  MONGODB_DATABASE: modeling
  DOCS_ENABLED: "false"
  CORS_ORIGINS: ""

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: modeling-copilot
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: modeling-copilot
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: mongo
    spec:
      containers:
        - name: mongo
          # MongoDB 5.0+ requires AVX on x86_64. Version 4.4 is used for
          # compatibility with older k3s nodes that do not expose AVX.
          image: mongo:4.4.29
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_PASSWORD
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: modeling-copilot
spec:
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: modeling-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/thm-mni-ii/modeling-copilot-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_PASSWORD
            # Kubernetes expands the two previously declared variables here.
            - name: MONGODB_URI
              value: mongodb://$(DB_USER):$(DB_PASSWORD)@mongo:27017/?authSource=admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: modeling-copilot-config
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: modeling-copilot
spec:
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: modeling-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/thm-mni-ii/modeling-copilot-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: modeling-copilot
spec:
  stripPrefix:
    prefixes:
      - /api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modeling-copilot
  namespace: modeling-copilot
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: modeling-copilot-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
