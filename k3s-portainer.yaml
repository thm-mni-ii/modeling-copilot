# Create ConfigMaps and Secrets separately in Portainer, namespace modeling-copilot.
# Reference values only; keep these resources and the namespace when redeploying.
#
# ConfigMap: modeling-copilot-config
# MONGODB_DATABASE: modeling
# DOCS_ENABLED: "false"
# CORS_ORIGINS: ''
#
# ConfigMap: collab-kit-config
# MONGODB_DB: collab_kit
# ALLOWED_ORIGINS: ''
# CK_BASE_URL: http://collab-kit:24202
# SERVICE_ISSUER: modeling-copilot-api
# SERVICE_ALGORITHM: ES256
# SERVICE_ACTOR: service-modeling-copilot
# SERVICE_PUBLIC_KEY: ''
#
# Secret: modeling-copilot-api-secrets
# DB_USER: ''
# DB_PASSWORD: ''
# SERVICE_PRIVATE_KEY: ''
# OIDC_CLIENT_SECRET: '' (optional)
#
# Secret: dagu-auth
# token-secret: '' (JWT signing secret)
# admin-username: ''
# admin-password: ''
# api-key: '' (create in Dagu after its first start, then restart the API)
#
# Secret: collab-kit-secrets
# DB_USER: ''
# DB_PASSWORD: ''
# MONGO_KEYFILE: ''
apiVersion: v1
kind: Namespace
metadata:
  name: modeling-copilot

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modeling-copilot-backup
  namespace: modeling-copilot
data:
  # Used only in archive names, never to decide whether a backup is needed.
  BACKUP_RELEASE_VERSION: latest
  backup.sh: |
    #!/bin/sh
    set -eu
    umask 077

    : "${POD_UID:?POD_UID is required}"
    : "${MONGODB_DATABASE:?MONGODB_DATABASE is required}"
    : "${DB_USER:?DB_USER is required}"
    : "${DB_PASSWORD:?DB_PASSWORD is required}"
    case "$POD_UID" in
      *[!a-zA-Z0-9-]*) echo "Invalid pod UID." >&2; exit 1 ;;
    esac

    backup_root=${BACKUP_ROOT:-/backups}
    backup_dir="$backup_root/pod-$POD_UID"
    if [ -d "$backup_dir" ]; then
      # Init containers can run again; only reuse a complete, intact backup.
      cd "$backup_dir"
      sha256sum -c SHA256SUMS
      gzip -t ./*.archive.gz
      echo "Verified existing pre-migration backup: $backup_dir"
      exit 0
    fi

    version=$(printf '%s' "${BACKUP_RELEASE_VERSION:-unversioned}" | tr -c 'A-Za-z0-9._-' '_')
    timestamp=$(date -u +%Y%m%dT%H%M%SZ)
    archive="modeling_${version}_${timestamp}.archive.gz"
    staging=$(mktemp -d "$backup_root/.partial-$POD_UID-XXXXXX")
    cd "$staging"

    # A failed dump stays in a hidden staging directory and cannot be reused.
    mongodump --host "${MONGODB_HOST:-mongo}:27017" \
      --username "$DB_USER" --password "$DB_PASSWORD" \
      --authenticationDatabase admin --db "$MONGODB_DATABASE" \
      --archive="$archive" --gzip
    test -s "$archive"
    gzip -t "$archive"
    sha256sum "$archive" > SHA256SUMS
    sha256sum -c SHA256SUMS
    {
      printf 'database=%s\n' "$MONGODB_DATABASE"
      printf 'releaseVersion=%s\n' "$version"
      printf 'createdAtUtc=%s\n' "$timestamp"
      printf 'podUid=%s\n' "$POD_UID"
      printf 'archive=%s\n' "$archive"
      mongodump --version
    } > metadata.txt
    # Publish the whole backup atomically only after its files are persisted.
    sync
    mv "$staging" "$backup_dir"
    sync
    echo "Created pre-migration backup: $backup_dir/$archive"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: modeling-copilot-backups
  namespace: modeling-copilot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: modeling-copilot
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: modeling-copilot
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: mongo
    spec:
      containers:
        - name: mongo
          # MongoDB 5.0+ requires AVX on x86_64. Version 4.4 is used for
          # compatibility with older k3s nodes that do not expose AVX.
          image: mongo:4.4.29
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_PASSWORD
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: modeling-copilot
spec:
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: modeling-copilot
spec:
  replicas: 1
  # Stop the old API before the new pod backs up and migrates the database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: database-backup
          # Includes Database Tools compatible with the production MongoDB.
          image: mongo:4.4.29
          imagePullPolicy: IfNotPresent
          command: ["sh", "/etc/modeling-backup/backup.sh"]
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_PASSWORD
            - name: BACKUP_RELEASE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: modeling-copilot-backup
                  key: BACKUP_RELEASE_VERSION
          envFrom:
            - configMapRef:
                name: modeling-copilot-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: database-backups
              mountPath: /backups
            - name: database-backup-script
              mountPath: /etc/modeling-backup
              readOnly: true
      containers:
        - name: api
          image: ghcr.io/thm-mni-ii/modeling-copilot-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: DB_PASSWORD
            # Kubernetes expands the two previously declared variables here.
            - name: MONGODB_URI
              value: mongodb://$(DB_USER):$(DB_PASSWORD)@mongo:27017/?authSource=admin
            # Tokens of the feedback system: RS256 against the key set it publishes,
            # no shared secret.
            - name: JWT_ALGORITHM
              value: RS256
            - name: JWT_JWKS_URI
              value: https://feedback.mni.thm.de/oauth2/jwks
            - name: JWT_ISSUER
              value: https://feedback.mni.thm.de
            # Client id the tokens are issued to; blank means not checked.
            - name: JWT_AUDIENCE
              value: ''
            - name: DAGU_BASE_URL
              value: http://dagu:8080/dagu
            - name: DAGU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dagu-auth
                  key: api-key
                  # Allows the API to start while Dagu's first API key is created.
                  optional: true
            # Sign-in without the feedback system: the API exchanges the tokens there.
            # Only a CONFIDENTIAL app gets a secret here and renews with it; for a
            # PUBLIC app leave it unset, the web app then renews in a hidden frame.
            - name: OIDC_TOKEN_URI
              value: https://feedback.mni.thm.de/oauth2/token
            - name: OIDC_CLIENT_ID
              value: modeling-copilot
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: OIDC_CLIENT_SECRET
                  # Optional, so the API also starts before the secret exists.
                  optional: true
            # Shared service settings are managed in collab-kit-config in Portainer.
            - name: CK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: collab-kit-config
                  key: CK_BASE_URL
            - name: SERVICE_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: collab-kit-config
                  key: SERVICE_ISSUER
            - name: SERVICE_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: collab-kit-config
                  key: SERVICE_ALGORITHM
            - name: SERVICE_ACTOR
              valueFrom:
                configMapKeyRef:
                  name: collab-kit-config
                  key: SERVICE_ACTOR
            # The API signs Collab-Kit service tokens with this private key.
            - name: SERVICE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: modeling-copilot-api-secrets
                  key: SERVICE_PRIVATE_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: modeling-copilot-config
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: database-backups
          persistentVolumeClaim:
            claimName: modeling-copilot-backups
        - name: database-backup-script
          configMap:
            name: modeling-copilot-backup
            items:
              - key: backup.sh
                path: backup.sh

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: modeling-copilot
spec:
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: modeling-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/thm-mni-ii/modeling-copilot-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: modeling-copilot
spec:
  stripPrefix:
    prefixes:
      - /api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modeling-copilot
  namespace: modeling-copilot
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: modeling-copilot-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80

---
# Collab-Kit, the published image with its own database. The secret collab-kit-secrets
# holds DB_USER, DB_PASSWORD and MONGO_KEYFILE.
# MONGO_KEYFILE is raw secret material (prefer a random value of 32-768 bytes).
# The init container encodes it as base64 for MongoDB's keyfile format.
apiVersion: v1
kind: Service
metadata:
  name: ck-mongo
  namespace: modeling-copilot
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: ck-mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ck-mongo
  namespace: modeling-copilot
spec:
  serviceName: ck-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: ck-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: ck-mongo
    spec:
      initContainers:
        # A replica set with a password needs a key file that only mongod may read.
        # A secret volume cannot set the owner, so the encoded key gets owner and mode here.
        - name: keyfile
          image: mongo:4.4.29
          command:
            - sh
            - -ec
            - |
              umask 077
              base64 -w 0 /secret/keyfile > /keyfile/keyfile
              key_length=$(wc -c < /keyfile/keyfile)
              if [ "$key_length" -lt 6 ] || [ "$key_length" -gt 1024 ]; then
                echo "MONGO_KEYFILE must encode to 6-1024 base64 characters." >&2
                exit 1
              fi
              chown 999:999 /keyfile/keyfile
              chmod 400 /keyfile/keyfile
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongo
          # Same version as mongo above, the nodes do not expose AVX.
          image: mongo:4.4.29
          imagePullPolicy: IfNotPresent
          # Collab-Kit needs transactions, and those need a replica set.
          args: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/keyfile"]
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: collab-kit-secrets
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: collab-kit-secrets
                  key: DB_PASSWORD
          readinessProbe:
            # Initiates the replica set on first start and reports ready once it is primary.
            exec:
              command:
                - sh
                - -c
                - >-
                  mongo --quiet --authenticationDatabase admin
                  -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --eval 'var status = rs.status();
                  if (status.code === 94) {
                    var result = rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
                    if (!result.ok) { printjson(result); quit(1); }
                  } else if (!status.ok) { printjson(status); quit(1); }
                  quit(db.isMaster().ismaster ? 0 : 1);'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: ck-mongo-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
              readOnly: true
      volumes:
        - name: secret
          secret:
            secretName: collab-kit-secrets
            items:
              - key: MONGO_KEYFILE
                path: keyfile
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: ck-mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: collab-kit
  namespace: modeling-copilot
spec:
  selector:
    app.kubernetes.io/name: modeling-copilot
    app.kubernetes.io/component: collab-kit
  ports:
    - name: http
      port: 24202
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-kit
  namespace: modeling-copilot
spec:
  replicas: 1
  # Open workpieces live in the memory of one process, so two pods must never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: modeling-copilot
      app.kubernetes.io/component: collab-kit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeling-copilot
        app.kubernetes.io/component: collab-kit
    spec:
      containers:
        - name: collab-kit
          # Fixed version; an update means changing the tag here and in docker-compose.yaml.
          image: ghcr.io/thm-mni-ii/collab-kit:v0.6.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 24202
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: collab-kit-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: collab-kit-secrets
                  key: DB_PASSWORD
            # The replica set knows itself as localhost, so the driver must not follow it.
            - name: MONGODB_URI
              value: mongodb://$(DB_USER):$(DB_PASSWORD)@ck-mongo:27017/?authSource=admin&replicaSet=rs0&directConnection=true
            # Same Feedbacksystem tokens as the api.
            - name: JWT_ALGORITHM
              value: RS256
            - name: JWT_JWKS_URI
              value: https://feedback.mni.thm.de/oauth2/jwks
            - name: JWT_ISSUER
              value: https://feedback.mni.thm.de
            - name: JWT_AUDIENCE
              value: ''
            - name: ACTOR_CLAIM
              value: id
            - name: TOP_CLAIM
              value: globalRole
            - name: TOP_VALUES
              value: ADMIN,MODERATOR
            # Admins keep every right but see no true keys behind pseudonyms.
            - name: TOP_SEES_PSEUDONYMS
              value: "false"
          envFrom:
            - configMapRef:
                name: collab-kit-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-collab-kit
  namespace: modeling-copilot
spec:
  stripPrefix:
    prefixes:
      - /collab-kit

---
# HTTP and WebSocket share the path: /collab-kit/ws/<workpiece> reaches the service as /ws/<workpiece>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collab-kit
  namespace: modeling-copilot
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: modeling-copilot-strip-collab-kit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /collab-kit
            pathType: Prefix
            backend:
              service:
                name: collab-kit
                port:
                  number: 24202

---
apiVersion: v1
kind: Namespace
metadata:
  name: workflow-runtime

---
# Identity used by the Dagu deployment itself to manage workflow Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagu-controller
  namespace: modeling-copilot

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-runner
  namespace: workflow-runtime
automountServiceAccountToken: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workflow-data
  namespace: workflow-runtime
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
# Namespaced RBAC: only what Dagu needs to run and observe workflow Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dagu-job-manager
  namespace: workflow-runtime
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dagu-job-manager
  namespace: workflow-runtime
subjects:
  - kind: ServiceAccount
    name: dagu-controller
    namespace: modeling-copilot
roleRef:
  kind: Role
  name: dagu-job-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dagu-data
  namespace: modeling-copilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagu
  namespace: modeling-copilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dagu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagu
    spec:
      serviceAccountName: dagu-controller
      initContainers:
        # Clones the public repo instead of relying on a hostPath checkout on
        # the node (Portainer only applies the manifest).
        - name: git-sync
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              git clone --depth=1 --branch=main https://github.com/thm-mni-ii/modeling-copilot.git /repo
              # Resolve local workflow image names only in this production copy.
              sed -i \
                -e 's|image: modeling-copilot/|image: ghcr.io/thm-mni-ii/modeling-copilot-|g' \
                -e 's|image_pull_policy: IfNotPresent|image_pull_policy: Always|g' \
                /repo/dagu/workflows/*.yaml
          volumeMounts:
            - name: repo-sync
              mountPath: /repo
      containers:
        - name: dagu
          # Pinned version - never use "latest" here.
          image: ghcr.io/dagucloud/dagu:2.16.6
          imagePullPolicy: IfNotPresent
          command: ["dagu", "start-all"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DAGU_HOST
              value: "0.0.0.0"
            - name: DAGU_PORT
              value: "8080"
            - name: DAGU_DAGS_DIR
              value: /app/dagu/workflows
            - name: DAGU_WIKI_DIR
              value: /var/lib/dagu/wiki
            - name: DAGU_DATA_DIR
              value: /var/lib/dagu/data
            - name: DAGU_LOG_DIR
              value: /var/lib/dagu/logs
            - name: DAGU_SKIP_EXAMPLES
              value: "true"
            - name: DAGU_BASE_CONFIG
              value: /app/dagu/infra/base.yaml
            - name: DAGU_BASE_PATH
              value: /dagu
            - name: DAGU_PUBLIC_URL
              value: https://ikarus.mni.thm.de/dagu
            - name: DAGU_AUTH_MODE
              value: builtin
            - name: DAGU_AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: dagu-auth
                  key: token-secret
            - name: DAGU_AUTH_BUILTIN_INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dagu-auth
                  key: admin-username
            - name: DAGU_AUTH_BUILTIN_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagu-auth
                  key: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: dagu-data
              mountPath: /var/lib/dagu
            - name: repo-sync
              mountPath: /app/dagu
              subPath: dagu
      volumes:
        - name: dagu-data
          persistentVolumeClaim:
            claimName: dagu-data
        - name: repo-sync
          emptyDir: {}

---
