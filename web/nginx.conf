server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The entry page names the current bundles, so browsers must revalidate it after a release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite bundle names are content-hashed. A missing one must not answer with index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
