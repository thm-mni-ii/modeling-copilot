artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [REFERENCE_KEY, EVALUATION_ID]
    properties:
      REFERENCE_KEY:
        type: string
      EVALUATION_ID:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    REFERENCE_KEY: ''
    EVALUATION_ID: ''
    OUTPUT_PREFIX: candidates
steps:
  - name: match_synonyms
    description: Speichert die vollständige semantische Kandidatenevidenz für ein Referenzpaar.
    stdout:
      artifact: candidates-result.json
    action: http.request
    with:
