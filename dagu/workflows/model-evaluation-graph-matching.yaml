---
name: analytical-feedback-pair
description: Erzeugt analytische Profile und die kompakte Feedbackprojektion je Musterlösung.
tags:
  - visibility=internal
  - version=v1
artifacts:
  enabled: true
kubernetes:
  volumes:
    - name: workflow-data
      persistent_volume_claim:
        claim_name: workflow-data
  volume_mounts:
    - name: workflow-data
      mount_path: /work/evaluations
params:
  schema:
    type: object
    required: [REFERENCE_KEY, EVALUATION_ID]
    properties:
      REFERENCE_KEY:
        type: string
      EVALUATION_ID:
        type: string
  values:
    REFERENCE_KEY: ''
    EVALUATION_ID: ''
steps:
  - name: generate_analytical_feedback
    description: Validiert den Artefaktsatz und veröffentlicht eine unveränderliche Analyse.
    stdout:
      artifact: analysis-result.json
    action: k8s.run
    with:
      image: modeling-copilot/analytical-feedback:v1
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${EVALUATION_ID}
        - name: REFERENCE_KEY
          value: ${REFERENCE_KEY}

  - name: read_analysis_metadata
    id: read_analysis_metadata
    description: Liest den Übergabevertrag der veröffentlichten Analyse.
    depends: [generate_analytical_feedback]
    action: jq.filter
    with:
      input: ${context.paths.artifacts_dir}/analysis-result.json
      filter: '(.analysisPath // .path) as $path | if .status != "ok" or ($path | type) != "string" then error("invalid analytical feedback output: missing analysis path") elif ($path | test("^analysis/[A-Za-z0-9_-]{1,100}/[a-f0-9]{64}\\.json$") | not) then error("invalid analytical feedback output: invalid analysis path") else {analysisPath: $path, analysisKey: ($path | split("/") | last | rtrimstr(".json"))} end'
    output:
      analysisPath:
        from: stdout
        decode: json
        select: .analysisPath
      analysisKey:
        from: stdout
        decode: json
        select: .analysisKey

  - name: generate_feedback
    description: Projiziert den konkret veröffentlichten Analysebericht in den kompakten Feedbackvertrag.
    depends: [read_analysis_metadata]
    stdout:
      artifact: feedback-result.json
    action: k8s.run
    with:
      image: modeling-copilot/feedback-generation:v1
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${EVALUATION_ID}
        - name: REFERENCE_KEY
          value: ${REFERENCE_KEY}
        - name: ANALYSIS_INPUT_PATH
          value: ${read_analysis_metadata.output.analysisPath}
        - name: WORKFLOW_OUTPUT_PATH
          value: feedback/${REFERENCE_KEY}.json

  - name: publish_analysis
    description: Veröffentlicht den konkreten Analysepfad dieses Unterlaufs.
    depends: [read_analysis_metadata]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        referenceKey: ${REFERENCE_KEY}
        analysisPath: ${read_analysis_metadata.output.analysisPath}
        analysisKey: ${read_analysis_metadata.output.analysisKey}
        artifactPath: analysis-result.json
