description: Hauptworkflow für die Modellauswertung mit Snapshots, Graphen und Bezeichnungslisten. Noch keine fachliche Bewertung.
artifacts:
  enabled: true
kubernetes:
  volumes:
    - name: workflow-data
      persistent_volume_claim:
        claim_name: workflow-data
  volume_mounts:
    - name: workflow-data
      mount_path: /work/evaluations
labels:
  purpose: evaluation
  domain: generic
  visibility: frontend
  version: v1
params:
  schema:
    type: object
    required: [evaluation_id, evaluation_input, parser_models, model_count, reference_count]
    properties:
      evaluation_id:
        type: string
        description: Eindeutige Auswertungs-ID und isolierter Datenordner.
      evaluation_input:
        type: string
        description: Ein vollständiger evaluation-input/v1-Snapshot als gzip-komprimiertes Base64-JSON.
      parser_models:
        type: string
        description: JSON-Liste der Modellschlüssel; enthält keine XML-Daten.
      model_count:
        type: integer
      reference_count:
        type: integer
  # Dagu-Laufzeitparameter sind skalare Werte. Das Backend serialisiert die
  # strukturierten Werte als JSON und überschreibt diese neutralen Defaults.
  values:
    evaluation_id: ''
    evaluation_input: ''
    parser_models: '[]'
    model_count: 0
    reference_count: 0
steps:
  - name: prepare_input
    description: Validiert und speichert den vollständigen Snapshot einmalig.
    stdout:
      artifact: initialization.json
    action: k8s.run
    with:
      image: modeling-copilot/workflow-data:0.2.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}
        - name: EVALUATION_INPUT_GZIP_BASE64
          value: ${evaluation_input}

  - name: parse_models
    description: Ein eigener Parserlauf für das aktuelle Modell und jede Musterlösung.
    depends: [prepare_input]
    action: dag.run
    with:
      dag: graph-parser-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
        OUTPUT_PREFIX: graphs
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: extract_labels
    description: Extrahiert die Bezeichnungen des aktuellen Modells und jeder Musterlösung.
    depends: [parse_models]
    action: dag.run
    with:
      dag: model-label-extraction-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
        INPUT_PREFIX: graphs
        OUTPUT_PREFIX: labels
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: publish_results
    description: Veröffentlicht Laufkontext, Graphen und Bezeichnungslisten.
    depends: [extract_labels]
    action: outputs.write
    with:
      values:
        evaluationId: ${evaluation_id}
        modelCount: ${model_count}
        referenceCount: ${reference_count}
        inputSnapshot: inputs/evaluation-input.json
        parsedModels: graphs/
        modelLabels: labels/
        assessmentAvailable: false

---
name: graph-parser-model
description: Parst genau einen Modell-Snapshot als eigenen Kubernetes Job.
tags:
  - visibility=internal
artifacts:
  enabled: true
kubernetes:
  volumes:
    - name: workflow-data
      persistent_volume_claim:
        claim_name: workflow-data
  volume_mounts:
    - name: workflow-data
      mount_path: /work/evaluations
params:
  schema:
    type: object
    required: [MODEL_KEY, EVALUATION_ID]
    properties:
      MODEL_KEY:
        type: string
      EVALUATION_ID:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    MODEL_KEY: ''
    EVALUATION_ID: ''
    OUTPUT_PREFIX: graphs
steps:
  - name: parse_model
    description: Speichert den normalisierten Graphen mit Quelle und Diagnosen als Workflow-Artefakt.
    stdout:
      artifact: parser-result.json
    action: k8s.run
    with:
      image: modeling-copilot/graph-parser:0.4.1
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${EVALUATION_ID}
        - name: MODEL_KEY
          value: ${MODEL_KEY}
        - name: WORKFLOW_OUTPUT_PATH
          value: ${OUTPUT_PREFIX}/${MODEL_KEY}.json

  - name: publish_graph
    description: Veröffentlicht Modellschlüssel und Graphreferenz.
    depends: [parse_model]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        modelKey: ${MODEL_KEY}
        graphPath: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
        artifactPath: parser-result.json

---
name: model-label-extraction-model
description: Extrahiert die Bezeichnungen genau eines Modellgraphen als eigenen Kubernetes Job.
tags:
  - visibility=internal
artifacts:
  enabled: true
kubernetes:
  volumes:
    - name: workflow-data
      persistent_volume_claim:
        claim_name: workflow-data
  volume_mounts:
    - name: workflow-data
      mount_path: /work/evaluations
params:
  schema:
    type: object
    required: [MODEL_KEY, EVALUATION_ID]
    properties:
      MODEL_KEY:
        type: string
      EVALUATION_ID:
        type: string
      INPUT_PREFIX:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    MODEL_KEY: ''
    EVALUATION_ID: ''
    INPUT_PREFIX: graphs
    OUTPUT_PREFIX: labels
steps:
  - name: extract_labels
    description: Speichert Original-IDs und Bezeichnungen als Workflow-Artefakt.
    stdout:
      artifact: labels-result.json
    action: k8s.run
    with:
      image: modeling-copilot/model-label-extraction:0.1.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${EVALUATION_ID}
        - name: WORKFLOW_INPUT_PATH
          value: ${INPUT_PREFIX}/${MODEL_KEY}.json
        - name: WORKFLOW_OUTPUT_PATH
          value: ${OUTPUT_PREFIX}/${MODEL_KEY}.json

  - name: publish_labels
    description: Veröffentlicht Modellschlüssel und Referenz auf die Bezeichnungsliste.
    depends: [extract_labels]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        modelKey: ${MODEL_KEY}
        labelsPath: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
        artifactPath: labels-result.json
