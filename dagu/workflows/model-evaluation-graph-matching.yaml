description: Reproduzierbare Auswertung aus vollständigen Snapshots mit gemeinsamem Workflow-Datenspeicher.
artifacts:
  enabled: true
kubernetes:
  volumes:
    - name: workflow-data
      persistent_volume_claim:
        claim_name: workflow-data
  volume_mounts:
    - name: workflow-data
      mount_path: /work/evaluations
labels:
  purpose: evaluation
  domain: generic
  visibility: frontend
  version: v1
params:
  schema:
    type: object
    required: [evaluation_id, evaluation_input, parser_models, model_count, reference_count]
    properties:
      evaluation_id:
        type: string
        description: Eindeutige Auswertungs-ID und isolierter Datenordner.
      evaluation_input:
        type: string
        description: Ein vollständiger evaluation-input/v1-Snapshot als gzip-komprimiertes Base64-JSON.
      parser_models:
        type: string
        description: JSON-Liste der Modellschlüssel; enthält keine XML-Daten.
      model_count:
        type: integer
      reference_count:
        type: integer
  # Dagu-Laufzeitparameter sind skalare Werte. Das Backend serialisiert die
  # strukturierten Werte als JSON und überschreibt diese neutralen Defaults.
  values:
    evaluation_id: ''
    evaluation_input: ''
    parser_models: '[]'
    model_count: 0
    reference_count: 0
steps:
  - name: prepare_input
    description: Speichert vollständige Eingaben und stellt Modellaufträge mit Prüfsummen bereit.
    stdout:
      artifact: inputs/evaluation-input.json
    action: k8s.run
    with:
      image: modeling-copilot/workflow-data:0.1.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_ACTION
          value: prepare
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}
        - name: EVALUATION_INPUT_GZIP_BASE64
          value: ${evaluation_input}

  - name: parse_models
    description: Ein eigener Parserlauf für das aktuelle Modell und jede Musterlösung.
    depends: [prepare_input]
    action: dag.run
    with:
      dag: graph-parser-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: collect_graphs
    description: Prüft alle Parserergebnisse und stellt Graphen und Referenzen gemeinsam bereit.
    depends: [parse_models]
    stdout:
      artifact: parsed-models.json
    action: k8s.run
    with:
      image: modeling-copilot/workflow-data:0.1.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_ACTION
          value: collect
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}

  - name: synonym_matching
    description: Liest reale Graphpaare; Synonym-Algorithmus ist noch ein Platzhalter.
    depends: [collect_graphs]
    stdout:
      artifact: results/synonym-matching.json
    action: k8s.run
    with:
      image: modeling-copilot/synonym-matching:0.2.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}

  - name: one_to_one_matching
    description: Liest Graphen und Synonym-Ergebnisse; 1:1-Algorithmus ist noch ein Platzhalter.
    depends: [synonym_matching]
    stdout:
      artifact: results/one-to-one-graph-matching.json
    action: k8s.run
    with:
      image: modeling-copilot/one-to-one-graph-matching:0.2.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}

  - name: minimal_matching_unit
    description: Liest dieselben Eingaben parallel zum 1:1-Matching; MMU-Algorithmus ist noch ein Platzhalter.
    depends: [synonym_matching]
    stdout:
      artifact: results/minimal-matching-unit.json
    action: k8s.run
    with:
      image: modeling-copilot/minimal-matching-unit:0.2.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}

  - name: feedback_aggregation
    description: Führt Ergebnisse getrennt je Musterlösung zusammen; erzeugt noch keine fachliche Bewertung.
    depends: [one_to_one_matching, minimal_matching_unit]
    stdout:
      artifact: evaluation-result.json
    action: k8s.run
    with:
      image: modeling-copilot/feedback-generation:0.2.0
      image_pull_policy: IfNotPresent
      env:
        - name: WORKFLOW_EVALUATION_ID
          value: ${evaluation_id}

  - name: publish_results
    description: Veröffentlicht lesbare Output-Werte und Dateiverweise für den gesamten Lauf.
    depends: [feedback_aggregation]
    action: outputs.write
    with:
      values:
        evaluationId: ${evaluation_id}
        modelCount: ${model_count}
        referenceCount: ${reference_count}
        inputSnapshot: inputs/evaluation-input.json
        parsedModels: parsed-models.json
        evaluationResult: evaluation-result.json
        assessmentAvailable: false
