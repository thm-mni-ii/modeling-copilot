---
name: analytical-feedback-pair
description: Erzeugt analytische Profile und die kompakte Feedbackprojektion je Musterlösung.
tags:
  - visibility=internal
  - version=v20
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [REFERENCE_KEY, EVALUATION_ID]
    properties:
      REFERENCE_KEY:
        type: string
      EVALUATION_ID:
        type: string
  values:
    REFERENCE_KEY: ''
    EVALUATION_ID: ''
steps:
  - name: generate_analytical_feedback
    description: Validiert den Artefaktsatz und veröffentlicht eine unveränderliche Analyse.
    stdout:
      artifact: analysis-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30086/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        REFERENCE_KEY: ${REFERENCE_KEY}
      silent: true
      timeout: 300

  - name: read_analysis_metadata
    id: read_analysis_metadata
    description: Liest den Übergabevertrag der veröffentlichten Analyse.
    depends: [generate_analytical_feedback]
    action: jq.filter
    with:
      input: ${context.paths.artifacts_dir}/analysis-result.json
      filter: >-
        if .status != "ok" or (.analysisPath | type) != "string" or (.analysisKey | type) != "string"
        then error("invalid analytical feedback output: missing analysis metadata")
        elif (.analysisPath | test("^analysis/[A-Za-z0-9_-]{1,100}/[a-f0-9]{64}\\.json$") | not)
        or (.analysisKey | test("^[a-f0-9]{64}$") | not)
        then error("invalid analytical feedback output: invalid analysis metadata")
        elif (.analysisPath | split("/") | last) != (.analysisKey + ".json")
        then error("invalid analytical feedback output: analysis key does not match path")
        else {analysisPath, analysisKey} end
    stdout:
      outputs:
        fields:
          analysisPath:
            decode: json
            select: .analysisPath
          analysisKey:
            decode: json
            select: .analysisKey

  - name: generate_feedback
    description: Projiziert den konkret veröffentlichten Analysebericht in den kompakten Feedbackvertrag.
    depends: [read_analysis_metadata]
    stdout:
      artifact: feedback-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30087/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        REFERENCE_KEY: ${REFERENCE_KEY}
        ANALYSIS_INPUT_PATH: ${steps.read_analysis_metadata.outputs.analysisPath}
        WORKFLOW_OUTPUT_PATH: feedback/${REFERENCE_KEY}.json
      silent: true
      timeout: 300

  - name: publish_analysis
    description: Veröffentlicht den konkreten Analysepfad dieses Unterlaufs.
    depends: [read_analysis_metadata]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        referenceKey: ${REFERENCE_KEY}
        analysisPath: ${steps.read_analysis_metadata.outputs.analysisPath}
        analysisKey: ${steps.read_analysis_metadata.outputs.analysisKey}
        artifactPath: analysis-result.json
