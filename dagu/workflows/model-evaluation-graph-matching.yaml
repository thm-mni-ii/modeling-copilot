description: Vorläufiger Graphvergleich und Feedback je Musterlösung. Noch keine vollständige fachliche Bewertung.
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
# Every service step calls a warm service (dagu/infra/workflow-services.yaml) with
# http.request; the response body is the service's unchanged CLI stdout.
labels:
  purpose: evaluation
  domain: generic
  visibility: frontend
  version: v33
  phase: '6'
params:
  schema:
    type: object
    required: [evaluation_id, evaluation_input, parser_models, reference_models, model_count, reference_count]
    properties:
      evaluation_id:
        type: string
        description: Eindeutige Auswertungs-ID und isolierter Datenordner.
      evaluation_input:
        type: string
        description: Ein vollständiger evaluation-input/v1-Snapshot als gzip-komprimiertes Base64-JSON.
      parser_models:
        type: string
        description: JSON-Liste der Modellschlüssel; enthält keine XML-Daten.
      reference_models:
        type: string
        description: JSON-Liste der Referenzschlüssel für den paarweisen Vergleich mit der Abgabe.
      model_count:
        type: integer
      reference_count:
        type: integer
      text_evidence:
        type: string
        description: Optionale Schwellen der Evidenzstufen als JSON-Objekt (spelling, meaning, meaningFloor); leer verwendet die Standardwerte.
  # Dagu-Laufzeitparameter sind skalare Werte. Das Backend serialisiert die
  # strukturierten Werte als JSON und überschreibt diese neutralen Defaults.
  values:
    evaluation_id: ''
    evaluation_input: ''
    parser_models: '[]'
    reference_models: '[]'
    model_count: 0
    reference_count: 0
    text_evidence: ''
steps:
  - name: prepare_input
    description: Validiert und speichert den vollständigen Snapshot einmalig.
    stdout:
      artifact: initialization.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30081/run
      form:
        WORKFLOW_EVALUATION_ID: ${evaluation_id}
        EVALUATION_INPUT_GZIP_BASE64: ${evaluation_input}
        TEXT_EVIDENCE: ${text_evidence}
      silent: true
      timeout: 300

  - name: parse_models
    description: Ein eigener Parserlauf für das aktuelle Modell und jede Musterlösung.
    depends: [prepare_input]
    action: dag.run
    with:
      dag: graph-parser-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
        OUTPUT_PREFIX: graphs
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: extract_labels
    description: Erstellt die vollständigen Elementinventare des aktuellen Modells und jeder Musterlösung.
    depends: [parse_models]
    action: dag.run
    with:
      dag: model-label-extraction-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
        INPUT_PREFIX: graphs
        OUTPUT_PREFIX: labels
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: match_synonyms
    description: Vergleicht das Abgabeinventar mit jeder Musterlösung und erhält alle semantischen Kandidaten.
    depends: [extract_labels]
    action: dag.run
    with:
      dag: synonym-matching-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
        OUTPUT_PREFIX: candidates
    parallel:
      items: ${reference_models}
      max_concurrent: 1

  - name: match_graphs
    description: Berechnet vorläufige Zuordnungsvorschläge und Zugehörigkeitsevidenz je Musterlösung.
    depends: [match_synonyms]
    action: dag.run
    with:
      dag: one-to-one-graph-matching-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
        OUTPUT_PREFIX: comparisons
    parallel:
      items: ${reference_models}
      max_concurrent: 1

  - name: export_synonym_signals
    description: Optional glossary by-product; a failure never affects the evaluation.
    depends: [match_graphs]
    continue_on:
      failure: true
      mark_success: true
    action: dag.run
    with:
      dag: synonym-signals-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
    parallel:
      items: ${reference_models}
      max_concurrent: 1

  - name: generate_analytical_feedback
    description: Erstellt je Musterlösung analytische Profile und daraus den kompakten Feedbackbericht.
    depends: [match_graphs]
    action: dag.run
    with:
      dag: analytical-feedback-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
    parallel:
      items: ${reference_models}
      max_concurrent: 1

  - name: publish_results
    description: Veröffentlicht die Übersicht des vorläufigen Vergleichs; eine vollständige Bewertung liegt noch nicht vor.
    depends: [generate_analytical_feedback]
    action: outputs.write
    with:
      values:
        schema: evaluation-preview/v1
        evaluationId: ${evaluation_id}
        completedPhase: 6
        modelCount: ${model_count}
        referenceCount: ${reference_count}
        textEvidence: ${text_evidence}
        inputSnapshot: inputs/evaluation-input.json
        parsedModels: graphs/
        modelLabels: labels/
        synonymCandidates: candidates/
        referenceComparisons: comparisons/
        analyticalFeedbackReports: analysis/
        feedbackReports: feedback/
        assessmentAvailable: false

---
name: graph-parser-model
description: Parst genau einen Modell-Snapshot über den warmen Parser-Dienst.
tags:
  - visibility=internal
  - version=v3
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [MODEL_KEY, EVALUATION_ID]
    properties:
      MODEL_KEY:
        type: string
      EVALUATION_ID:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    MODEL_KEY: ''
    EVALUATION_ID: ''
    OUTPUT_PREFIX: graphs
steps:
  - name: parse_model
    description: Speichert den normalisierten Graphen mit Quelle und Diagnosen als Workflow-Artefakt.
    stdout:
      artifact: parser-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30082/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        MODEL_KEY: ${MODEL_KEY}
        WORKFLOW_OUTPUT_PATH: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
      silent: true
      timeout: 300

  - name: publish_graph
    description: Veröffentlicht Modellschlüssel und Graphreferenz.
    depends: [parse_model]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        modelKey: ${MODEL_KEY}
        graphPath: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
        artifactPath: parser-result.json

---
name: model-label-extraction-model
description: Erstellt das vollständige Elementinventar genau eines Modellgraphen über den warmen Extraktionsdienst.
tags:
  - visibility=internal
  - version=v3
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [MODEL_KEY, EVALUATION_ID]
    properties:
      MODEL_KEY:
        type: string
      EVALUATION_ID:
        type: string
      INPUT_PREFIX:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    MODEL_KEY: ''
    EVALUATION_ID: ''
    INPUT_PREFIX: graphs
    OUTPUT_PREFIX: labels
steps:
  - name: extract_labels
    description: Speichert das vollständige Elementinventar mit Original-IDs, Vergleichstexten und Herkunft als Workflow-Artefakt.
    stdout:
      artifact: labels-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30083/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        WORKFLOW_INPUT_PATH: ${INPUT_PREFIX}/${MODEL_KEY}.json
        WORKFLOW_OUTPUT_PATH: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
      silent: true
      timeout: 300

  - name: publish_labels
    description: Veröffentlicht Modellschlüssel und Referenz auf die Bezeichnungsliste.
    depends: [extract_labels]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        modelKey: ${MODEL_KEY}
        labelsPath: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
        artifactPath: labels-result.json

---
