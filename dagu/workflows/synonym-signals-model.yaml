description: Recalculates synonym signals of one evaluated submission from its frozen snapshot, without feedback.
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
labels:
  purpose: glossary
  domain: generic
  visibility: internal
  version: v3
params:
  schema:
    type: object
    required: [evaluation_id, evaluation_input, parser_models, reference_models]
    properties:
      evaluation_id:
        type: string
      evaluation_input:
        type: string
      parser_models:
        type: string
      reference_models:
        type: string
      text_evidence:
        type: string
  values:
    evaluation_id: ''
    evaluation_input: ''
    parser_models: '[]'
    reference_models: '[]'
    text_evidence: ''
steps:
  - name: prepare_input
    stdout:
      artifact: initialization.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30081/run
      form:
        WORKFLOW_EVALUATION_ID: ${evaluation_id}
        EVALUATION_INPUT_GZIP_BASE64: ${evaluation_input}
        TEXT_EVIDENCE: ${text_evidence}
      silent: true
      timeout: 300

  - name: parse_models
    depends: [prepare_input]
    action: dag.run
    with:
      dag: graph-parser-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
        OUTPUT_PREFIX: graphs
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: extract_labels
    depends: [parse_models]
    action: dag.run
    with:
      dag: model-label-extraction-model
      params:
        EVALUATION_ID: ${evaluation_id}
        MODEL_KEY: ${ITEM.key}
        INPUT_PREFIX: graphs
        OUTPUT_PREFIX: labels
    parallel:
      items: ${parser_models}
      max_concurrent: 4

  - name: match_synonyms
    depends: [extract_labels]
    action: dag.run
    with:
      dag: synonym-matching-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
        OUTPUT_PREFIX: candidates
    parallel:
      items: ${reference_models}
      max_concurrent: 1

  - name: match_graphs
    depends: [match_synonyms]
    action: dag.run
    with:
      dag: one-to-one-graph-matching-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
        OUTPUT_PREFIX: comparisons
    parallel:
      items: ${reference_models}
      max_concurrent: 1

  - name: export_synonym_signals
    depends: [match_graphs]
    action: dag.run
    with:
      dag: synonym-signals-pair
      params:
        EVALUATION_ID: ${evaluation_id}
        REFERENCE_KEY: ${ITEM.key}
    parallel:
      items: ${reference_models}
      max_concurrent: 1

---
name: graph-parser-model
description: Parst genau einen Modell-Snapshot über den warmen Parser-Dienst.
tags:
  - visibility=internal
  - version=v2
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [MODEL_KEY, EVALUATION_ID]
    properties:
      MODEL_KEY:
        type: string
      EVALUATION_ID:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    MODEL_KEY: ''
    EVALUATION_ID: ''
    OUTPUT_PREFIX: graphs
steps:
  - name: parse_model
    description: Speichert den normalisierten Graphen mit Quelle und Diagnosen als Workflow-Artefakt.
    stdout:
      artifact: parser-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30082/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        MODEL_KEY: ${MODEL_KEY}
        WORKFLOW_OUTPUT_PATH: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
      silent: true
      timeout: 300

  - name: publish_graph
    description: Veröffentlicht Modellschlüssel und Graphreferenz.
    depends: [parse_model]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        modelKey: ${MODEL_KEY}
        graphPath: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
        artifactPath: parser-result.json

---
name: model-label-extraction-model
description: Erstellt das vollständige Elementinventar genau eines Modellgraphen über den warmen Extraktionsdienst.
tags:
  - visibility=internal
  - version=v2
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [MODEL_KEY, EVALUATION_ID]
    properties:
      MODEL_KEY:
        type: string
      EVALUATION_ID:
        type: string
      INPUT_PREFIX:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    MODEL_KEY: ''
    EVALUATION_ID: ''
    INPUT_PREFIX: graphs
    OUTPUT_PREFIX: labels
steps:
  - name: extract_labels
    description: Speichert das vollständige Elementinventar mit Original-IDs, Vergleichstexten und Herkunft als Workflow-Artefakt.
    stdout:
      artifact: labels-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30083/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        WORKFLOW_INPUT_PATH: ${INPUT_PREFIX}/${MODEL_KEY}.json
        WORKFLOW_OUTPUT_PATH: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
      silent: true
      timeout: 300

  - name: publish_labels
    description: Veröffentlicht Modellschlüssel und Referenz auf die Bezeichnungsliste.
    depends: [extract_labels]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        modelKey: ${MODEL_KEY}
        labelsPath: ${OUTPUT_PREFIX}/${MODEL_KEY}.json
        artifactPath: labels-result.json

---
name: synonym-matching-pair

description: Berechnet semantische Kandidaten für die Abgabe und genau eine Musterlösung.
tags:
  - visibility=internal
  - version=v9
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [REFERENCE_KEY, EVALUATION_ID]
    properties:
      REFERENCE_KEY:
        type: string
      EVALUATION_ID:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    REFERENCE_KEY: ''
    EVALUATION_ID: ''
    OUTPUT_PREFIX: candidates
steps:
  - name: match_synonyms
    description: Speichert die vollständige semantische Kandidatenevidenz für ein Referenzpaar.
    stdout:
      artifact: candidates-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30084/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        REFERENCE_KEY: ${REFERENCE_KEY}
        WORKFLOW_OUTPUT_PATH: ${OUTPUT_PREFIX}/${REFERENCE_KEY}.json
      silent: true
      timeout: 300

  - name: publish_candidates
    description: Veröffentlicht Referenzschlüssel und Kandidatenartefakt.
    depends: [match_synonyms]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        referenceKey: ${REFERENCE_KEY}
        candidatesPath: ${OUTPUT_PREFIX}/${REFERENCE_KEY}.json
        artifactPath: candidates-result.json

---
name: one-to-one-graph-matching-pair
description: Vergleicht die Abgabe vorläufig mit genau einer Musterlösung.
tags:
  - visibility=internal
  - version=v19
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [REFERENCE_KEY, EVALUATION_ID]
    properties:
      REFERENCE_KEY:
        type: string
      EVALUATION_ID:
        type: string
      OUTPUT_PREFIX:
        type: string
  values:
    REFERENCE_KEY: ''
    EVALUATION_ID: ''
    OUTPUT_PREFIX: comparisons
steps:
  - name: match_graph
    description: Speichert den vorläufigen Vergleich und seine Herkunftsdaten.
    stdout:
      artifact: comparison-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30085/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        REFERENCE_KEY: ${REFERENCE_KEY}
        WORKFLOW_OUTPUT_PATH: ${OUTPUT_PREFIX}/${REFERENCE_KEY}.json
      silent: true
      timeout: 300

  - name: publish_comparison
    description: Veröffentlicht Referenzschlüssel und Vergleichsartefakt.
    depends: [match_graph]
    action: outputs.write
    with:
      values:
        evaluationId: ${EVALUATION_ID}
        referenceKey: ${REFERENCE_KEY}
        comparisonPath: ${OUTPUT_PREFIX}/${REFERENCE_KEY}.json
        artifactPath: comparison-result.json

---
name: synonym-signals-pair
description: Exports open-element synonym signals of one reference comparison.
tags:
  - visibility=internal
  - version=v1
# Dagu does not pass its process environment to steps; read the host at load time.
# Sub-DAGs do not inherit env, so every document declares it.
env:
  - SERVICES_HOST: ${WORKFLOW_SERVICES_HOST}
artifacts:
  enabled: true
params:
  schema:
    type: object
    required: [REFERENCE_KEY, EVALUATION_ID]
    properties:
      REFERENCE_KEY:
        type: string
      EVALUATION_ID:
        type: string
  values:
    REFERENCE_KEY: ''
    EVALUATION_ID: ''
steps:
  - name: export_signals
    description: Stores synonym-signals/v1 for one reference as a workflow artifact.
    stdout:
      artifact: signals-result.json
    action: http.request
    with:
      method: POST
      url: http://${env.SERVICES_HOST}:30084/run
      form:
        WORKFLOW_EVALUATION_ID: ${EVALUATION_ID}
        REFERENCE_KEY: ${REFERENCE_KEY}
        WORKFLOW_INPUT_PATH: comparisons/${REFERENCE_KEY}.json
        WORKFLOW_OUTPUT_PATH: signals/${REFERENCE_KEY}.json
      silent: true
      timeout: 120
