steps:
  - name: start
    action: k8s.run
    with:
      image: alpine:latest
      command: echo start

  - name: parallel-a
    action: k8s.run
    depends: [start]
    with:
      image: alpine:latest
      command: echo parallel-a

  - name: parallel-b
    action: k8s.run
    depends: [start]
    with:
      image: alpine:latest
      command: echo parallel-b

  - name: finish
    action: k8s.run
    depends: [parallel-a, parallel-b]
    with:
      image: alpine:latest
      command: echo finish
