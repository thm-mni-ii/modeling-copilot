---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synonym-matching
  namespace: workflow-runtime
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: synonym-matching}
  template:
    metadata:
      labels: {app.kubernetes.io/name: synonym-matching, app.kubernetes.io/part-of: workflow-services}
    spec:
      serviceAccountName: workflow-runner
      containers:
        - name: service
          image: modeling-copilot/synonym-matching:v11
          imagePullPolicy: IfNotPresent
          # The embedding model is loaded before the port opens, so readiness means warm.
          command: [python, -u, /app/workflow_server.py, /app/src/main.py, --port, "30084",
                    --warmup, "synonym_matching.methods.multilingual:preload"]
          ports: [{name: synonym, containerPort: 30084}]
          readinessProbe: {httpGet: {path: /healthz, port: synonym}, periodSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: workflow-data, mountPath: /work/evaluations}]
      volumes:
        - {name: workflow-data, persistentVolumeClaim: {claimName: workflow-data}}

