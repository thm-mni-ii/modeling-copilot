# Warm workflow services (dev and prod).
#
# Each service keeps its process and libraries loaded and runs its unchanged CLI
# main() per HTTP request (`workflow_server.py`). Dagu calls them with
# `http.request` instead of starting one Kubernetes Job per step.
#
#   kubectl apply -f dagu/infra/workflow-services.yaml
#
# One Service exposes every deployment on its own fixed port. The named
# targetPort makes each Service port route only to pods that declare that name.
# Port numbers equal the dev NodePorts (`infra/dev/kubernetes.yaml`), so the
# workflow only needs WORKFLOW_SERVICES_HOST from the Dagu process.
# The PVC is ReadWriteOnce: all replicas must run on the node that mounts it.

apiVersion: v1
kind: Service
metadata:
  name: workflow-services
  namespace: workflow-runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: workflow-services
  ports:
    - {name: workflow-data, port: 30081, targetPort: workflow-data}
    - {name: graph-parser, port: 30082, targetPort: graph-parser}
    - {name: label-extract, port: 30083, targetPort: label-extract}
    - {name: synonym, port: 30084, targetPort: synonym}
    - {name: graph-matching, port: 30085, targetPort: graph-matching}
    - {name: analytical, port: 30086, targetPort: analytical}
    - {name: feedback, port: 30087, targetPort: feedback}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-data
  namespace: workflow-runtime
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: workflow-data}
  template:
    metadata:
      labels: {app.kubernetes.io/name: workflow-data, app.kubernetes.io/part-of: workflow-services}
    spec:
      serviceAccountName: workflow-runner
      containers:
        - name: service
          image: modeling-copilot/workflow-data:v11
          imagePullPolicy: IfNotPresent
          command: [python, -u, /app/workflow_server.py, /app/src/main.py, --port, "30081"]
          ports: [{name: workflow-data, containerPort: 30081}]
          readinessProbe: {httpGet: {path: /healthz, port: workflow-data}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts: [{name: workflow-data, mountPath: /work/evaluations}]
      volumes:
        - {name: workflow-data, persistentVolumeClaim: {claimName: workflow-data}}

